vocabulary:
  name: Storyblok Vocabulary
  description: >-
    Domain vocabulary for Storyblok headless CMS APIs covering content
    management, delivery, image processing, and webhook concepts.
  version: '1.0'
  created: '2026-05-02'
  modified: '2026-05-02'

domains:
  - name: Content
    description: Core content management concepts in Storyblok
    terms:
      - term: story
        definition: >-
          The primary content entity in Storyblok. A story is a content entry
          defined by a component schema and holds structured content. Stories
          can represent pages, posts, products, or any content type.
        aliases: [content entry, page, post]
      - term: space
        definition: >-
          A Storyblok workspace containing all content, components, assets,
          and settings for one or more projects or websites.
        aliases: [workspace, project]
      - term: slug
        definition: >-
          A URL-safe string identifier for a story within its parent folder.
          Combined with parent folder slugs to form the full_slug.
      - term: full_slug
        definition: >-
          The complete URL path of a story from the space root, formed by
          joining parent folder slugs with the story's own slug using slashes.
      - term: startpage
        definition: >-
          A story designated as the entry point for a folder or space.
          Accessible at the folder URL without appending the story slug.
      - term: draft
        definition: >-
          An unpublished version of a story containing the latest editor
          changes. Accessible via the Content Delivery API with version=draft.
      - term: published
        definition: >-
          The live version of a story visible to end users. Published stories
          are served by the CDN and accessible without authentication.
      - term: version
        definition: >-
          Content delivery version parameter. Use 'published' to fetch live
          content or 'draft' to fetch editor content (requires auth token).
        values: [published, draft]

  - name: Components
    description: Storyblok component system concepts
    terms:
      - term: component
        definition: >-
          A reusable content schema that defines the structure and field types
          for story content. Components are the building blocks of Storyblok
          content architecture.
        aliases: [content type, block type]
      - term: blok
        definition: >-
          A component instance within story content, identified by a _uid
          and component field. Bloks can be nested to build complex layouts.
        aliases: [block, component instance]
      - term: field type
        definition: >-
          The type of data a component field holds. Common field types include
          text, textarea, richtext, image, asset, link, number, boolean,
          date, options, and bloks (nested components).
      - term: schema
        definition: >-
          The definition of a component's fields, their types, and validation
          rules. Schemas are managed via the Management API.

  - name: Assets
    description: Media and file management concepts
    terms:
      - term: asset
        definition: >-
          A file stored in the Storyblok asset library. Assets include images,
          documents, videos, and other media files uploaded to a space.
      - term: asset_path
        definition: >-
          The URL path to an asset file within the Storyblok CDN, used as
          input for the Image Service transformation URLs.
      - term: image transformation
        definition: >-
          On-the-fly processing of images by the Image Service, including
          resizing, cropping, format conversion, and filter application.
      - term: filter chain
        definition: >-
          A sequence of image filters applied in the Image Service URL path,
          such as quality(), grayscale(), blur(), and format().
      - term: fit-in
        definition: >-
          An image resizing mode that scales the image to fit within the
          specified dimensions while maintaining the original aspect ratio,
          never upscaling beyond the original size.

  - name: Distribution
    description: Content delivery and API access concepts
    terms:
      - term: CDN token
        definition: >-
          A read-only API token for the Content Delivery API. Used as a query
          parameter or header to authenticate public content requests.
        aliases: [public token, access token]
      - term: personal access token
        definition: >-
          A full-access API token for the Management API. Must be kept secret
          and used only in server-side code.
        aliases: [management token, OAuth token]
      - term: regional endpoint
        definition: >-
          A Content Delivery API URL optimized for a specific geographic region
          to minimize latency. Available for US, Asia-Pacific, Canada, and China.
      - term: cv
        definition: >-
          Cache version timestamp returned with content responses. Pass as the
          cv parameter to bust the CDN cache and fetch the latest content.
      - term: relation resolution
        definition: >-
          The process of expanding story references embedded in content fields
          into full story objects in the API response.
        aliases: [resolve_relations, rels]
      - term: pagination
        definition: >-
          Mechanism for paginating large collections. Controlled via per_page
          and page parameters. Total count is returned in the Total header.

  - name: Webhooks
    description: Event-driven integration concepts
    terms:
      - term: webhook
        definition: >-
          An HTTP callback that Storyblok sends to a configured endpoint when
          content events occur in a space.
      - term: webhook event
        definition: >-
          An action that triggers a webhook notification. Common events include
          story.published, story.unpublished, story.deleted, asset.created,
          and pipeline_stage.changed.
      - term: space_id
        definition: >-
          The numeric identifier of the Storyblok space that emitted a webhook.
      - term: action
        definition: >-
          The type of content operation that triggered a webhook event.
        values: [published, unpublished, moved, deleted, draft_save]

  - name: Datasources
    description: Reusable data management concepts
    terms:
      - term: datasource
        definition: >-
          A reusable key-value collection in a Storyblok space, used for
          option lists, translations, configuration, and reference data.
      - term: datasource entry
        definition: >-
          A single key-value pair within a datasource. Entries can be
          dimension-aware for multi-language or multi-variant use cases.
      - term: dimension
        definition: >-
          A variant of a datasource entry for a specific locale or context,
          enabling datasources to serve localized content.
