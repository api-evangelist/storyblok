aid: storyblok
name: Storyblok
description: Storyblok is a headless content management system (CMS) with a visual
  editor that enables developers and content editors to collaboratively build and
  manage digital experiences. It provides APIs for content delivery, content management,
  image optimization, and webhook-based event notifications. Storyblok supports composable
  content through reusable components, multi-language content, and multi-site management
  with real-time collaboration features.
