apis:
- aid: storyblok:storyblok-content-delivery-api
  name: Storyblok Content Delivery API
  description: The Storyblok Content Delivery API v2 enables developers to fetch published
    content from a Storyblok space for delivery to web, mobile, and other channels.
    Provides access to stories, datasources, links, tags, and asset metadata with
    filtering, pagination, and relation resolution. Available across multiple regional
    endpoints for global low-latency delivery.
  humanURL: https://www.storyblok.com/docs/api/content-delivery/v2
  baseURL: https://api.storyblok.com/v2/cdn
  tags:
  - Content Delivery
  - Headless CMS
  - REST API
  - Stories
  properties:
  - type: Documentation
    url: https://www.storyblok.com/docs/api/content-delivery/v2
  - type: OpenAPI
    url: https://raw.githubusercontent.com/api-evangelist/storyblok/refs/heads/main/openapi/storyblok-content-delivery-api-v2-openapi.yml
  - url: graphql/storyblok-graphql.md
    type: GraphQL
- aid: storyblok:storyblok-management-api
  name: Storyblok Management API
  description: The Storyblok Management API is a REST API for programmatically creating,
    reading, updating, and deleting content and configuration within a Storyblok space.
    Supports managing stories, components, assets, datasources, collaborators, webhooks,
    and space settings. Used for editorial tooling, content migration, CI/CD pipelines,
    and automated publishing workflows.
  humanURL: https://www.storyblok.com/docs/api/management
  baseURL: https://mapi.storyblok.com/v1
  tags:
  - Assets
  - CMS
  - Components
  - Content Management
  - REST API
  - Stories
  - Webhooks
  properties:
  - type: Documentation
    url: https://www.storyblok.com/docs/api/management
  - type: OpenAPI
    url: https://raw.githubusercontent.com/api-evangelist/storyblok/refs/heads/main/openapi/storyblok-management-api-openapi.yml
- aid: storyblok:storyblok-image-service
  name: Storyblok Image Service
  description: The Storyblok Image Service provides on-the-fly image resizing, cropping,
    filtering, and format conversion for assets stored in Storyblok. Supports fit-in
    resizing, smart cropping, focus-point-based cropping, and custom filter chains
    for quality adjustment, grayscale, and blur effects.
  humanURL: https://www.storyblok.com/docs/image-service
  baseURL: https://a.storyblok.com
  tags:
  - Image Optimization
  - Image Processing
  - Media
  properties:
  - type: Documentation
    url: https://www.storyblok.com/docs/image-service
  - type: OpenAPI
    url: https://raw.githubusercontent.com/api-evangelist/storyblok/refs/heads/main/openapi/storyblok-image-service-openapi.yml
- aid: storyblok:storyblok-webhooks
  name: Storyblok Webhooks
  description: Storyblok emits webhook events when content actions occur in a space
    such as story publication, unpublication, deletion, asset upload, and pipeline
    stage transitions. AsyncAPI specification for webhook event schemas.
  humanURL: https://www.storyblok.com/docs/guide/in-depth/webhooks
  tags:
  - AsyncAPI
  - Events
  - Real-Time
  - Webhooks
  properties:
  - type: Documentation
    url: https://www.storyblok.com/docs/guide/in-depth/webhooks
  - type: AsyncAPI
    url: https://raw.githubusercontent.com/api-evangelist/storyblok/refs/heads/main/asyncapi/storyblok-webhooks-asyncapi.yml
common:
- type: ArazzoWorkflows
  url: arazzo/
  workflows:
  - url: arazzo/storyblok-asset-to-story-workflow.yml
    name: Storyblok Asset to Story
    summary: Sign an asset upload, create a story that references the asset, then
      publish it.
  - url: arazzo/storyblok-author-and-publish-story-workflow.yml
    name: Storyblok Author and Publish Story
    summary: Create a draft story, read it back, update its content, then publish
      it.
  - url: arazzo/storyblok-build-navigation-workflow.yml
    name: Storyblok Build Navigation
    summary: Pull the space link tree for a folder, then fetch the folder start page
      content for a navigation header.
  - url: arazzo/storyblok-clone-component-workflow.yml
    name: Storyblok Clone Component
    summary: Read an existing component definition, recreate it under a new name,
      and confirm it via the component list.
  - url: arazzo/storyblok-component-to-story-workflow.yml
    name: Storyblok Component to Story
    summary: Define a component schema, create a story that uses it, then publish
      the story.
  - url: arazzo/storyblok-onboard-collaborator-workflow.yml
    name: Storyblok Onboard Collaborator
    summary: Validate the space, invite a collaborator with a role, then list collaborators
      to confirm the invitation.
  - url: arazzo/storyblok-provision-datasource-workflow.yml
    name: Storyblok Provision Datasource
    summary: Validate the space, create a datasource, then read its entries back through
      the Content Delivery API.
  - url: arazzo/storyblok-publish-and-verify-delivery-workflow.yml
    name: Storyblok Publish and Verify Delivery
    summary: Publish a draft story via the Management API and verify it is live through
      the Content Delivery API.
  - url: arazzo/storyblok-register-webhook-workflow.yml
    name: Storyblok Register Webhook
    summary: Validate the space, register a webhook endpoint, then read it back to
      confirm it is active.
  - url: arazzo/storyblok-retire-story-workflow.yml
    name: Storyblok Retire Story
    summary: Read a story, unpublish it to pull it from delivery, then optionally
      delete it from the space.
  - url: arazzo/storyblok-tag-driven-content-sync-workflow.yml
    name: Storyblok Tag-Driven Content Sync
    summary: Discover tags, list the stories carrying a chosen tag, then fetch the
      full content of the first match.
