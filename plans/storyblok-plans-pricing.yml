description: Storyblok uses a tiered subscription model (Starter / Growth / Growth Plus / Premium / Elite)
  with included quotas for traffic, API requests, AI credits, locales, and seats. Overages are sold as
  metered add-ons (e.g. $10 per 1M extra API requests, $75 per 250GB extra traffic, $20 per 200k AI credits,
  $20/locale/month). Premium and Elite are custom-quoted.
sources:
  - https://www.storyblok.com/pricing
