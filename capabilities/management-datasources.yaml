naftiko: 1.0.0-alpha2
info:
  label: Storyblok Management API — Datasources
  description: 'Storyblok Management API — Datasources. 2 operations. Lead operation: List datasources in a space. Self-contained
    Naftiko capability covering one Storyblok business surface.'
  tags:
  - Storyblok
  - Datasources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STORYBLOK_API_KEY: STORYBLOK_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-datasources
    baseUri: https://mapi.storyblok.com/v1
    description: Storyblok Management API — Datasources business capability. Self-contained, no shared references.
    resources:
    - name: spaces-space_id-datasources
      path: /spaces/{space_id}/datasources
      operations:
      - name: listmanagementdatasources
        method: GET
        description: List datasources in a space
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdatasource
        method: POST
        description: Create a datasource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.STORYBLOK_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-datasources-rest
    port: 8080
    description: REST adapter for Storyblok Management API — Datasources. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/spaces/{space-id}/datasources
      name: spaces-space-id-datasources
      description: REST surface for spaces-space_id-datasources.
      operations:
      - method: GET
        name: listmanagementdatasources
        description: List datasources in a space
        call: management-datasources.listmanagementdatasources
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdatasource
        description: Create a datasource
        call: management-datasources.createdatasource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-datasources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Storyblok Management API — Datasources. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-datasources-space
      description: List datasources in a space
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-datasources.listmanagementdatasources
      outputParameters:
      - type: object
        mapping: $.
    - name: create-datasource
      description: Create a datasource
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-datasources.createdatasource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
