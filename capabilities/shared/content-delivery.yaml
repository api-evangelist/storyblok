naftiko: "1.0.0-alpha1"

info:
  label: "Storyblok Content Delivery API"
  description: >-
    Read-only API for fetching published content from a Storyblok space.
    Provides access to stories, datasources, links, and tags for delivery
    to web, mobile, and other channels.
  tags:
    - CMS
    - Content Delivery
    - Headless CMS
    - Stories
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STORYBLOK_CDN_TOKEN: STORYBLOK_CDN_TOKEN

capability:
  consumes:
    - type: http
      namespace: storyblok-cdn
      baseUri: https://api.storyblok.com/v2/cdn
      description: "Storyblok Content Delivery API v2"
      authentication:
        type: apikey
        key: token
        value: "{{STORYBLOK_CDN_TOKEN}}"
        placement: query
      resources:
        - name: stories
          path: /stories
          description: "Published story content"
          operations:
            - name: list-stories
              method: GET
              description: "List published stories with filtering and pagination"
              inputParameters:
                - name: version
                  in: query
                  type: string
                  required: false
                  description: "Content version: published or draft"
                - name: starts_with
                  in: query
                  type: string
                  required: false
                  description: "Filter stories by slug prefix"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Results per page (max 200)"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number for pagination"
                - name: sort_by
                  in: query
                  type: string
                  required: false
                  description: "Field to sort by"
                - name: search_term
                  in: query
                  type: string
                  required: false
                  description: "Full-text search query"
                - name: filter_query
                  in: query
                  type: string
                  required: false
                  description: "Filter stories by component field values"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-story-by-slug
              method: GET
              description: "Retrieve a single story by its full slug"
              inputParameters:
                - name: slug
                  in: path
                  type: string
                  required: true
                  description: "Full slug of the story"
                - name: version
                  in: query
                  type: string
                  required: false
                  description: "Content version: published or draft"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-story-by-id
              method: GET
              description: "Retrieve a single story by its numeric ID"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Numeric story ID"
                - name: version
                  in: query
                  type: string
                  required: false
                  description: "Content version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: datasources
          path: /datasources
          description: "Reusable key-value datasources"
          operations:
            - name: list-datasources
              method: GET
              description: "List datasources in the space"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-datasource-entries
              method: GET
              description: "List entries from a datasource"
              inputParameters:
                - name: datasource
                  in: query
                  type: string
                  required: false
                  description: "Datasource slug to filter entries"
                - name: dimension
                  in: query
                  type: string
                  required: false
                  description: "Dimension (locale) for entries"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: links
          path: /links
          description: "Story URL tree for navigation"
          operations:
            - name: list-links
              method: GET
              description: "List all story links for sitemap or navigation"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tags
          path: /tags
          description: "Story tags"
          operations:
            - name: list-tags
              method: GET
              description: "List all tags used in stories"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: storyblok-cdn-rest
      resources:
        - path: /v1/stories
          name: stories
          operations:
            - method: GET
              name: list-stories
              description: "List published stories"
              call: "storyblok-cdn.list-stories"
              with:
                version: "rest.version"
                starts_with: "rest.starts_with"
                per_page: "rest.per_page"
                page: "rest.page"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/stories/{slug}
          name: story-by-slug
          operations:
            - method: GET
              name: get-story-by-slug
              description: "Get story by slug"
              call: "storyblok-cdn.get-story-by-slug"
              with:
                slug: "rest.slug"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/links
          name: links
          operations:
            - method: GET
              name: list-links
              description: "List story navigation links"
              call: "storyblok-cdn.list-links"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/tags
          name: tags
          operations:
            - method: GET
              name: list-tags
              description: "List content tags"
              call: "storyblok-cdn.list-tags"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/datasources
          name: datasources
          operations:
            - method: GET
              name: list-datasources
              description: "List datasources"
              call: "storyblok-cdn.list-datasources"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: storyblok-cdn-mcp
      transport: http
      tools:
        - name: list-stories
          description: "List published stories with optional filtering and pagination"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-cdn.list-stories"
          with:
            version: "tools.version"
            starts_with: "tools.starts_with"
            per_page: "tools.per_page"
            page: "tools.page"
            search_term: "tools.search_term"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-story-by-slug
          description: "Get a published story by its full URL slug"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-cdn.get-story-by-slug"
          with:
            slug: "tools.slug"
            version: "tools.version"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-links
          description: "Get the full story link tree for navigation or sitemap generation"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-cdn.list-links"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-datasource-entries
          description: "Fetch entries from a Storyblok datasource (options lists, translations)"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-cdn.list-datasource-entries"
          with:
            datasource: "tools.datasource"
            dimension: "tools.dimension"
          outputParameters:
            - type: object
              mapping: "$."
