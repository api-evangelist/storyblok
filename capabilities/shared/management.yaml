naftiko: "1.0.0-alpha1"

info:
  label: "Storyblok Management API"
  description: >-
    Full read/write API for programmatically managing content and configuration
    within a Storyblok space. Supports stories, components, assets, datasources,
    collaborators, webhooks, and space settings.
  tags:
    - Assets
    - CMS
    - Components
    - Content Management
    - Stories
    - Webhooks
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STORYBLOK_MANAGEMENT_TOKEN: STORYBLOK_MANAGEMENT_TOKEN

capability:
  consumes:
    - type: http
      namespace: storyblok-mapi
      baseUri: https://mapi.storyblok.com/v1
      description: "Storyblok Management API"
      authentication:
        type: bearer
        token: "{{STORYBLOK_MANAGEMENT_TOKEN}}"
      resources:
        - name: spaces
          path: /spaces/{space_id}
          description: "Space configuration and metadata"
          operations:
            - name: get-space
              method: GET
              description: "Retrieve space details and configuration"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Numeric space identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: stories
          path: /spaces/{space_id}/stories
          description: "Story CRUD operations"
          operations:
            - name: list-management-stories
              method: GET
              description: "List stories in a space with pagination"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: text_search
                  in: query
                  type: string
                  required: false
                  description: "Search query"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-story
              method: POST
              description: "Create a new story in the space"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  story: "{{tools.story}}"
            - name: get-story
              method: GET
              description: "Retrieve a story by ID"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: story_id
                  in: path
                  type: integer
                  required: true
                  description: "Story identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-story
              method: PUT
              description: "Update an existing story"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: story_id
                  in: path
                  type: integer
                  required: true
                  description: "Story identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  story: "{{tools.story}}"
            - name: delete-story
              method: DELETE
              description: "Delete a story"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: story_id
                  in: path
                  type: integer
                  required: true
                  description: "Story identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: publish-story
              method: GET
              description: "Publish a story"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: story_id
                  in: path
                  type: integer
                  required: true
                  description: "Story identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: unpublish-story
              method: GET
              description: "Unpublish a story"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: story_id
                  in: path
                  type: integer
                  required: true
                  description: "Story identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: components
          path: /spaces/{space_id}/components
          description: "Component schema management"
          operations:
            - name: list-components
              method: GET
              description: "List component definitions in a space"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-component
              method: GET
              description: "Retrieve a component definition by ID"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: component_id
                  in: path
                  type: integer
                  required: true
                  description: "Component identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: assets
          path: /spaces/{space_id}/assets
          description: "Asset library management"
          operations:
            - name: list-assets
              method: GET
              description: "List assets in the space library"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search query"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhooks
          path: /spaces/{space_id}/webhook_endpoints
          description: "Webhook endpoint management"
          operations:
            - name: list-webhooks
              method: GET
              description: "List webhook endpoints configured in the space"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-webhook
              method: POST
              description: "Create a new webhook endpoint"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  webhook_endpoint: "{{tools.webhook_endpoint}}"
            - name: delete-webhook
              method: DELETE
              description: "Delete a webhook endpoint"
              inputParameters:
                - name: space_id
                  in: path
                  type: integer
                  required: true
                  description: "Space identifier"
                - name: webhook_id
                  in: path
                  type: integer
                  required: true
                  description: "Webhook identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: storyblok-mapi-rest
      resources:
        - path: /v1/spaces/{space-id}/stories
          name: management-stories
          operations:
            - method: GET
              name: list-management-stories
              description: "List stories via management API"
              call: "storyblok-mapi.list-management-stories"
              with:
                space_id: "rest.space-id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-story
              description: "Create a new story"
              call: "storyblok-mapi.create-story"
              with:
                space_id: "rest.space-id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: storyblok-mapi-mcp
      transport: http
      tools:
        - name: list-management-stories
          description: "List stories via management API with full metadata"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-mapi.list-management-stories"
          with:
            space_id: "tools.space_id"
            per_page: "tools.per_page"
            page: "tools.page"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-story
          description: "Create a new story in Storyblok"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "storyblok-mapi.create-story"
          with:
            space_id: "tools.space_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-story
          description: "Publish a draft story to make it live"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "storyblok-mapi.publish-story"
          with:
            space_id: "tools.space_id"
            story_id: "tools.story_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-components
          description: "List component schemas defined in the space"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-mapi.list-components"
          with:
            space_id: "tools.space_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-assets
          description: "List media assets in the space library"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-mapi.list-assets"
          with:
            space_id: "tools.space_id"
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-webhooks
          description: "List configured webhook endpoints"
          hints:
            readOnly: true
            openWorld: false
          call: "storyblok-mapi.list-webhooks"
          with:
            space_id: "tools.space_id"
          outputParameters:
            - type: object
              mapping: "$."
