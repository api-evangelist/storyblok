description: FOCUS-aligned FinOps definition for Storyblok. Storyblok bills a tiered monthly or annual
  subscription with included quotas for traffic, API requests, AI credits, locales, and seats; overages
  on each meter are billed as separate line items at published per-unit rates.
sources:
  - https://www.storyblok.com/pricing
  - https://www.storyblok.com/docs/api/content-delivery/v2
billingModel:
  pricingCategory: Tiered Subscription + Usage Overages
  billingFrequency: Monthly or Annual
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Storyblok
  ServiceCategory: Content Management
  ProviderName: Storyblok
  PublisherName: Storyblok GmbH
  InvoiceIssuerName: Storyblok GmbH
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: base_subscription
    description: Monthly or annual base plan fee for the subscribed tier
    unit: month
    aggregation: sum
    dimensions:
      - plan
  - name: user_seats
    description: Active user seats above the included count, billed at $15/seat/month
    unit: seat
    aggregation: max
    dimensions:
      - plan
      - role
  - name: traffic_gb
    description: Outbound traffic served above the included plan allotment, billed at $75 per 250GB
    unit: GB
    aggregation: sum
    dimensions:
      - region
      - space
  - name: api_requests
    description: Content Delivery API requests above the included plan allotment, billed at $10 per 1M
    unit: request
    aggregation: sum
    dimensions:
      - api
      - cache_status
      - space
  - name: locales
    description: Locales above the included count, billed at $20/locale/month
    unit: locale
    aggregation: max
    dimensions:
      - locale_code
      - space
  - name: ai_credits
    description: AI credits consumed above the included plan allotment, billed at $20 per 200k credits
    unit: credit
    aggregation: sum
    dimensions:
      - feature
      - space
principles:
  - name: Visibility
    description: Use the Storyblok account dashboard usage views to track traffic GB, API requests,
      AI credit consumption, seats, and locales against included plan allotments.
  - name: Allocation
    description: Allocate cost by space and locale; use Storyblok spaces as the primary attribution
      boundary for multi-product tenants.
  - name: Optimization
    description: Maximize the use of cached CDN requests (1,000 RPS limit vs 50 RPS uncached) to stay
      under the API request quota; consolidate locales onto fewer paid locales where possible; choose
      annual billing for the published discount on Growth and Growth Plus.
  - name: Accountability
    description: Assign a Storyblok workspace owner per space; review monthly usage against included
      limits to forecast overage spend; escalate to Premium/Elite when overages exceed roughly 1.5-2x
      the next tier's base price.
